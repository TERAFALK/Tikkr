<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        /* Fjord. Ingen bildruta ska nagonsin visa svart. */
        background: #0e1a2b;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 1080px;
        height: 1920px;
      }
      /* Scen 4 ligger OVER scen 3, sa att den mjuka korsningen mellan dem
         fungerar: scen 3 star kvar under medan Fjord-ytan tonar upp. */
      #sc1 {
        z-index: 1;
      }
      #sc2 {
        z-index: 2;
      }
      #sc3 {
        z-index: 3;
      }
      #sc4 {
        z-index: 4;
      }
    </style>
  </head>
  <body>
    <!-- TIKKR — launchvideo, staende 1080x1920, 20.74 s.
         Manus, scenindelning och motiv: ../brag-plan.md
         Scenbytena ligger pa musikens taktrutnat (109.96 BPM):
         4.39 / 11.46 / 16.93 / 20.75.

         Spar 12 har samma tempo som spar 10 men en annan fas: rutnaten ar
         i praktiken identiska fran 8.7 s och framat och skiljer sig bara i
         borjan, sa bara de forsta atta sekunderna flyttade. -->
    <div
      id="root"
      data-composition-id="main"
      data-no-timeline
      data-start="0"
      data-duration="20.75"
      data-width="1080"
      data-height="1920"
    >
      <div
        id="sc1"
        class="scene clip"
        data-composition-id="sc1"
        data-composition-src="compositions/scene-1.html"
        data-start="0"
        data-duration="4.39"
        data-track-index="0"
      ></div>
      <div
        id="sc2"
        class="scene clip"
        data-composition-id="sc2"
        data-composition-src="compositions/scene-2.html"
        data-start="4.39"
        data-duration="7.07"
        data-track-index="1"
      ></div>
      <div
        id="sc3"
        class="scene clip"
        data-composition-id="sc3"
        data-composition-src="compositions/scene-3.html"
        data-start="11.46"
        data-duration="5.77"
        data-track-index="2"
      ></div>
      <div
        id="sc4"
        class="scene clip"
        data-composition-id="sc4"
        data-composition-src="compositions/scene-4.html"
        data-start="16.93"
        data-duration="3.82"
        data-track-index="3"
      ></div>

      <!-- ============ LJUD ============
           Fyra sorters ljud i hela videon och inga fler. Varje ett av dem ar
           bundet till nagot tittaren SER tryckas eller landa; ar det inte
           det, hor det inte hit. Ingen svisch, ingen riser.

           Varje element har ett id. Utan id hittar renderaren inte mediet och
           spalten blir tyst. -->

      <!-- Musikbadd. Halv volym hela vagen — ingen rost att ducka for, men
           tonen begar en badd och inte ett soundtrack. -->
      <audio
        id="bgm"
        src="assets/music/happy-beats-business-moves-vol-12-by-ende-dot-app.mp3"
        data-start="0"
        data-duration="20.75"
        data-media-start="0"
        data-volume="0.5"
        data-fade-in="0.3"
        data-fade-out="0.8"
        data-has-audio="true"
        data-track-index="8"
      ></audio>

      <!-- Trycket pa namnet -->
      <audio
        id="sfx-press-name"
        src="assets/sfx/click2.ogg"
        data-start="6.00"
        data-duration="0.06"
        data-volume="0.55"
        data-has-audio="true"
        data-track-index="9"
      ></audio>

      <!-- Fyra siffror, ett slag var -->
      <audio id="sfx-key-1" src="assets/sfx/keypress-003.wav" data-start="6.56" data-duration="0.25" data-volume="0.4" data-has-audio="true" data-track-index="9"></audio>
      <audio id="sfx-key-2" src="assets/sfx/keypress-003.wav" data-start="7.09" data-duration="0.25" data-volume="0.4" data-has-audio="true" data-track-index="9"></audio>
      <audio id="sfx-key-3" src="assets/sfx/keypress-003.wav" data-start="7.64" data-duration="0.25" data-volume="0.4" data-has-audio="true" data-track-index="9"></audio>
      <audio id="sfx-key-4" src="assets/sfx/keypress-003.wav" data-start="8.19" data-duration="0.25" data-volume="0.4" data-has-audio="true" data-track-index="9"></audio>

      <!-- Trycket pa arbetsmomentet -->
      <audio
        id="sfx-press-moment"
        src="assets/sfx/click2.ogg"
        data-start="9.29"
        data-duration="0.06"
        data-volume="0.55"
        data-has-audio="true"
        data-track-index="9"
      ></audio>

      <!-- Kortet blir gront. Scenens poang, och darfor det starkaste ljudet. -->
      <audio
        id="sfx-confirm"
        src="assets/sfx/bong_001.ogg"
        data-start="9.83"
        data-duration="0.12"
        data-volume="0.5"
        data-has-audio="true"
        data-track-index="10"
      ></audio>

      <!-- Tre underlag landar. SAMMA ljud, dampat: det ar samma handelse,
           nagot som landar, och tre lika tunga ankomster. -->
      <audio id="sfx-doc-1" src="assets/sfx/bong_001.ogg" data-start="12.02" data-duration="0.12" data-volume="0.22" data-has-audio="true" data-track-index="10"></audio>
      <audio id="sfx-doc-2" src="assets/sfx/bong_001.ogg" data-start="13.11" data-duration="0.12" data-volume="0.22" data-has-audio="true" data-track-index="10"></audio>
      <audio id="sfx-doc-3" src="assets/sfx/bong_001.ogg" data-start="14.20" data-duration="0.12" data-volume="0.22" data-has-audio="true" data-track-index="10"></audio>

      <!-- Ordmarket landar, och sedan ingenting -->
      <audio
        id="sfx-logo"
        src="assets/sfx/impactSoft_medium_001.ogg"
        data-start="18.56"
        data-duration="0.18"
        data-volume="0.45"
        data-has-audio="true"
        data-track-index="10"
      ></audio>
    </div>
  </body>
</html>
