<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <link rel="stylesheet" href="assets/fonts/geist.css" />
    <link rel="stylesheet" href="assets/css/brand.css" />
    <script src="assets/js/gsap.min.js"></script>
    <style>
      html,
      body,
      #root {
        background: var(--fjord);
        overflow: hidden;
      }
      /* Motivet bloder utanfor ovre hogra hornet, precis som i heron. */
      #motif {
        right: -430px;
        top: -320px;
        width: 1240px;
        height: 1240px;
      }
      #eyebrow {
        left: 80px;
        top: 220px;
        opacity: 0;
        visibility: hidden;
      }
      #head {
        position: absolute;
        left: 80px;
        top: 560px;
        width: 920px;
        color: var(--white);
        font-size: 104px;
        font-weight: 600;
        line-height: 1.02;
        letter-spacing: var(--tracking-tight);
        opacity: 0;
        visibility: hidden;
      }
      #sub {
        position: absolute;
        left: 80px;
        top: 880px;
        color: var(--slate);
        font-size: 38px;
        font-weight: 400;
        letter-spacing: -0.01em;
        opacity: 0;
        visibility: hidden;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="scene-1" data-width="1080" data-height="1920">
      <svg id="motif" class="motif motif-dark" viewBox="0 0 60 60" aria-hidden="true">
        <path class="motif-a" d="M26 0A26 26 0 0 0 26 52Z" />
        <path class="motif-b" d="M34 8A26 26 0 0 1 34 60Z" />
      </svg>

      <div class="layer">
        <p id="eyebrow" class="eyebrow on-dark">
          <span class="num">01</span>
          <span class="rule"></span>
          <span class="what">Problemet</span>
        </p>
        <div id="head">Vad gjordes på tisdagen?</div>
        <div id="sub">På fredagen ska någon minnas.</div>
      </div>
    </div>
    <script>
      /* SCEN 1 — Problemet. Lokal tid 0 till 4.39.
       *
       * Fjord med motivet i hornet, saljsidans numrerade etikett, och tva
       * lasningar. Ingen rorelse utover ingangarna: tonen ar polished, och
       * sjalvsakerheten kommer ur hur lite scenen gor.
       */
      const tl = gsap.timeline({ paused: true });

      gsap.set("#eyebrow", { autoAlpha: 0 });
      gsap.set("#head", { autoAlpha: 0, y: 44 });
      gsap.set("#sub", { autoAlpha: 0, y: 18 });
      gsap.set("#motif", { autoAlpha: 0, scale: 1.04, transformOrigin: "100% 0%" });

      /* Motivet ar en YTA och inte ett element: det ska redan ha funnits dar,
         inte komma in. Darfor en lang, nastan omarklig intoning. */
      tl.to("#motif", { autoAlpha: 1, scale: 1, duration: 1.6, ease: "power1.out" }, 0);
      tl.to("#eyebrow", { autoAlpha: 1, duration: 0.4, ease: "power1.out" }, 0.1);
      // beat-locked: 0.56s — rubriken slar in pa forsta slaget
      tl.to("#head", { autoAlpha: 1, y: 0, duration: 0.36, ease: "power3.out" }, 0.56);
      // beat-grid: andra raden pa 2.73s
      tl.to("#sub", { autoAlpha: 1, y: 0, duration: 0.46, ease: "power2.out" }, 2.73);

      window.__timelines = window.__timelines || {};
      window.__timelines["scene-1"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
