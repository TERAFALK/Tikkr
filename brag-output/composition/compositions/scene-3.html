<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <link rel="stylesheet" href="assets/fonts/geist.css" />
    <link rel="stylesheet" href="assets/css/brand.css" />
    <script src="assets/js/gsap.min.js"></script>
    <style>
      html,
      body,
      #root {
        background: var(--snow);
        overflow: hidden;
      }
      /* Samma motiv, nu i Fjord over Sno och svagare: ett morkt motiv syns
         mer an ett ljust. Ur nedre vanstra hornet, som pa saljsidans
         problemavsnitt. */
      #motif {
        left: -460px;
        bottom: -480px;
        width: 1260px;
        height: 1260px;
      }
      #eyebrow {
        left: 120px;
        top: 150px;
        opacity: 0;
        visibility: hidden;
      }
      /* Det grona kortet fran scen 2, krympt till ett marke. Det star kvar som
         ursprunget till allt som foljer. */
      #chip {
        position: absolute;
        right: 120px;
        top: 124px;
        width: 440px;
        border-radius: 14px;
        background: var(--tick-deep);
        padding: 20px 24px;
        opacity: 0;
        visibility: hidden;
      }
      /* Vitt mot Tick Deep ger 3.44:1. Det racker for stor text men inte for
         normal, sa market skrivs over 24 px. */
      #chip .name {
        color: var(--white);
        font-size: 30px;
      }
      #chip .job {
        margin-top: 6px;
        font-size: 26px;
      }
      #line {
        position: absolute;
        left: 120px;
        top: 268px;
        width: 1680px;
        height: 1px;
        background: var(--lichen);
        transform-origin: left center;
      }
      #head {
        position: absolute;
        left: 120px;
        top: 350px;
        color: var(--fjord);
        font-size: 104px;
        font-weight: 600;
        letter-spacing: var(--tracking-tight);
        opacity: 0;
        visibility: hidden;
      }
      #cards {
        position: absolute;
        left: 120px;
        top: 640px;
        display: flex;
        gap: 36px;
      }
      /* Kortformen ar saljsidans egen, ur Documents(): en gron overetikett i
         versaler, en linje over, och titeln under. */
      .doc {
        width: 536px;
        height: 212px;
        border: 1px solid var(--lichen);
        border-radius: 18px;
        background: var(--white);
        padding: 40px;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        opacity: 0;
        visibility: hidden;
      }
      .doc-rule {
        height: 1px;
        background: var(--lichen);
        margin-bottom: 28px;
      }
      .doc-kicker {
        color: var(--tick-deep);
        font-size: 28px;
        font-weight: 500;
        text-transform: uppercase;
        letter-spacing: var(--tracking-wider);
      }
      .doc-title {
        margin-top: 16px;
        color: var(--fjord);
        font-size: 48px;
        font-weight: 600;
        line-height: 1.08;
        letter-spacing: -0.01em;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="scene-3" data-width="1920" data-height="1080">
      <svg id="motif" class="motif motif-light" viewBox="0 0 60 60" aria-hidden="true">
        <path class="motif-a" d="M26 0A26 26 0 0 0 26 52Z" />
        <path class="motif-b" d="M34 8A26 26 0 0 1 34 60Z" />
      </svg>

      <div class="layer">
        <p id="eyebrow" class="eyebrow">
          <span class="num">03</span>
          <span class="rule"></span>
          <span class="what">Dokumenten</span>
        </p>

        <div id="chip">
          <div class="name">Anna Lind</div>
          <div class="job">2601 · Svetsning</div>
        </div>

        <div id="line"></div>
        <div id="head">En stämpling. Tre underlag.</div>

        <div id="cards">
          <div class="doc" id="doc1">
            <div class="doc-rule"></div>
            <div class="doc-kicker">Till kunden</div>
            <div class="doc-title">Underlag per order</div>
          </div>
          <div class="doc" id="doc2">
            <div class="doc-rule"></div>
            <div class="doc-kicker">Internt</div>
            <div class="doc-title">Efterkalkyl</div>
          </div>
          <div class="doc" id="doc3">
            <div class="doc-rule"></div>
            <div class="doc-kicker">Till lönen</div>
            <div class="doc-title">Tidrapport per anställd</div>
          </div>
        </div>
      </div>
    </div>
    <script>
      /* SCEN 3 — Dokumenten. Lokal tid 0 till 5.77 (globalt 11.46-17.23).
       *
       * Scenen ar poangen med hela videon, och darfor far den den langsta
       * stillastaende halltiden: alla tre underlagen star tillsammans fran
       * 3.15 lokalt till scenens slut, knappt tre sekunder.
       *
       * Underlagen kommer pa VARANNAT slag och inte varje. Etiketterna ar text
       * som ska lasas, och ett slag var pa 110 BPM ar 0.546 s — snabbare an man
       * hinner lasa en rad.
       */
      const tl = gsap.timeline({ paused: true });

      gsap.set("#motif", { autoAlpha: 0, scale: 1.04, transformOrigin: "0% 100%" });
      gsap.set("#eyebrow", { autoAlpha: 0 });
      gsap.set("#chip", { autoAlpha: 0, scale: 0.92 });
      gsap.set("#head", { autoAlpha: 0, y: 24 });
      gsap.set(".doc", { autoAlpha: 0, y: 26 });

      tl.to("#motif", { autoAlpha: 1, scale: 1, duration: 1.5, ease: "power1.out" }, 0);
      tl.to("#eyebrow", { autoAlpha: 1, duration: 0.34, ease: "power1.out" }, 0);
      tl.to("#head", { autoAlpha: 1, y: 0, duration: 0.46, ease: "power2.out" }, 0);
      tl.to("#chip", { autoAlpha: 1, scale: 1, duration: 0.4, ease: "power2.out" }, 0.13);
      tl.fromTo("#line", { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power2.out" }, 0.18);
      // beat-grid: 0.56 / 1.65 / 2.74 lokalt (12.02 / 13.11 / 14.20 globalt)
      tl.to("#doc1", { autoAlpha: 1, y: 0, duration: 0.42, ease: "power2.out" }, 0.56);
      tl.to("#doc2", { autoAlpha: 1, y: 0, duration: 0.42, ease: "power2.out" }, 1.65);
      tl.to("#doc3", { autoAlpha: 1, y: 0, duration: 0.42, ease: "power2.out" }, 2.74);

      window.__timelines = window.__timelines || {};
      window.__timelines["scene-3"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
