# Tillägg för produktionsservern: Caddy framför appen.
#
# Används TILLSAMMANS med docker-compose.yml, aldrig ensam. Produktionens .env
# säger det en gång för alla:
#
#   COMPOSE_FILE=docker-compose.yml:docker-compose.prod.yml
#
# Då tar varje "docker compose" med båda filerna — release.sh, backup.sh,
# status.sh och ett handskrivet kommando lika. En flagga som måste skrivas
# varje gång glöms förr eller senare, och då startar appen utan Caddy.
#
# Labbet kör bara docker-compose.yml, bakom Nginx Proxy Manager.
#
# Caddy kopplas till samma nät som appen redan sitter på i labbet (npm_proxy).
# Namnet är labbets, men nätet gör samma sak här: det är vägen in till appen,
# och databasen ligger inte på det. Skapa det en gång på en ny server:
#
#   docker network create npm_proxy

services:
  # PORTEN NÅS BARA FRÅN SERVERN SJÄLV, oavsett vad .env säger. Docker
  # öppnar publicerade portar förbi brandväggen (ufw), så ett glömt
  # APP_BIND=127.0.0.1 hade gjort appen nåbar okrypterat från internet.
  # release.sh och status.sh når den här; alla andra går via Caddy.
  app:
    ports: !override
      - "127.0.0.1:${APP_PORT:-3000}:3000"

  caddy:
    image: caddy:2-alpine
    container_name: tikkr-caddy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL saknas i .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Certifikaten. Försvinner de begärs nya, och Let's Encrypt har tak för
      # hur ofta det får ske.
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - npm_proxy
    depends_on:
      - app

volumes:
  caddy_data:
  caddy_config:
