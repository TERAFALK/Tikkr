# Kontrollen som körs innan något når dev eller prod.
#
# Varje pull request och varje push till dev och prod går igenom två jobb,
# som körs samtidigt:
#
#   test   typkontroll och alla tester, mot en riktig Postgres
#   image  bygger samma Docker-image som servern bygger
#
# Ett rött kryss på en PR betyder att den inte ska slås ihop. Det här
# arbetsflödet driftsätter ingenting — produktionen uppdateras bara när någon
# kör release-rutinen på servern.

name: CI

on:
  pull_request:
  push:
    branches: [dev, prod]

# En ny push till samma gren avbryter körningen som redan pågår. Den gamla
# koden är ändå inaktuell.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# packages: paketen @terafalk/* ligger i GitHub Packages.
permissions:
  contents: read
  packages: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # En tom databas per körning. Namnet slutar på _test, annars vägrar
    # tests/setup.ts att starta — samma spärr som skyddar den skarpa
    # databasen på servern.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tikkr
          POSTGRES_PASSWORD: tikkr
          POSTGRES_DB: tikkr_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tikkr -d tikkr_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://tikkr:tikkr@localhost:5432/tikkr_test?schema=public
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v7

      # Node 22, samma som Docker-imagen. Inte laptopens version.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Installera beroenden
        run: npm ci

      - name: Generera Prisma-klienten
        run: npx prisma generate

      - name: Typkontroll
        run: npm run typecheck

      # Testdatabasen byggs med MIGRATIONERNA, i tur och ordning från en tom
      # databas — precis som en ny produktionsserver. En migration som inte
      # går att köra faller här, inte mot kunddata.
      - name: Kör migrationerna
        run: npx prisma migrate deploy

      # Fäller en ändring i schema.prisma som saknar migration. Databasen är
      # nu byggd av migrationerna; skiljer den sig från schemat har någon
      # ändrat schemat utan att skriva vägen dit, och produktionen hade fått
      # en annan databas än koden förväntar sig.
      - name: Schemat och migrationerna stämmer
        run: |
          if ! npx prisma migrate diff \
            --from-url "$DATABASE_URL" \
            --to-schema-datamodel prisma/schema.prisma \
            --exit-code > drift.sql; then
            echo "schema.prisma och migrationerna säger olika saker. Skillnaden:"
            cat drift.sql
            echo
            echo "Skapa migrationen med: node ops/new-migration.mjs <namn>"
            exit 1
          fi

      # Inte "npm test": det skriptet stoppar med flit, se
      # scripts/no-npm-test.mjs.
      - name: Tester
        run: npx vitest run

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v7

      # Hela Dockerfilen, med next build inuti. Fångar det som bara går sönder
      # i imagen och inte vid en vanlig build: Alpine i stället för Ubuntu,
      # filer som inte följer med till standalone-katalogen, PDF-bibliotekets
      # teckensnitt.
      - name: Bygg Docker-imagen
        run: >-
          docker build --target runner --tag tikkr-app:ci
          --secret id=npm_token,env=NODE_AUTH_TOKEN
          --build-arg TIKKR_VERSION=ci-${{ github.sha }} .

      # Startar imagen mot en riktig databas. Fångar det som bara går sönder i den
      # färdiga imagen: filer som inte följt med, fel vid start och migrationer som
      # inte går att köra i containern. Alla värden är påhittade.
      - name: Starttest
        run: |
          docker build --target builder --tag tikkr-migrate:ci             --secret id=npm_token,env=NODE_AUTH_TOKEN .

          URL="postgresql://tikkr:tikkr@start-db:5432/tikkr?schema=public"
          cat > start.env <<EOF_ENV
          DATABASE_URL=$URL
          AUTH_SECRET=starttest-ingen-hemlighet-alls-1234567890
          AUTH_TRUST_HOST=true
          APP_URL=http://localhost:3000
          EOF_ENV
          sed -i 's/^ *//' start.env

          docker network create start
          docker run -d --name start-db --network start             -e POSTGRES_USER=tikkr -e POSTGRES_PASSWORD=tikkr -e POSTGRES_DB=tikkr             postgres:17-alpine

          for _ in $(seq 1 30); do
            docker exec start-db pg_isready -U tikkr -d tikkr -q && break
            sleep 1
          done
          sleep 3

          docker run --rm --network start --env-file start.env             tikkr-migrate:ci sh ./ops/migrate.sh

          docker run -d --name start-app --network start --env-file start.env             -p 3000:3000 tikkr-app:ci

          for _ in $(seq 1 45); do
            if curl -fsS --max-time 3 http://127.0.0.1:3000/api/health; then
              echo
              curl -fsS -o /dev/null --max-time 5 http://127.0.0.1:3000/admin/login
              echo "Appen svarar."
              exit 0
            fi
            sleep 2
          done

          docker logs --tail 60 start-app
          echo "Appen svarar inte på /api/health efter 90 sekunder."
          exit 1

      # Compose-filerna läses som produktionen läser dem. Ett skrivfel i
      # docker-compose.prod.yml syns annars först på lanseringskvällen.
      #
      # Kontrollen av porten: APP_BIND sätts med flit till 0.0.0.0, och
      # produktionsfilen ska ändå låsa appen till 127.0.0.1. Docker öppnar
      # publicerade portar förbi brandväggen.
      - name: Kontrollera compose-filerna
        env:
          POSTGRES_PASSWORD: ci
          AUTH_SECRET: ci
          ACME_EMAIL: ci@example.com
          APP_BIND: 0.0.0.0
        run: |
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.prod.yml config --quiet

          BIND="$(docker compose -f docker-compose.yml -f docker-compose.prod.yml \
            config --format json | jq -r '[.services.app.ports[].host_ip] | join(",")')"
          echo "Produktionens app-port binder till: $BIND"
          [ "$BIND" = "127.0.0.1" ]

      - name: Kontrollera skripten
        run: |
          bash -n scripts/*.sh ops/*.sh ops/hooks/*.sh
          node ops/verify.mjs
