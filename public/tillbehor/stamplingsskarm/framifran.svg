      <circle cx="60" cy="30" r="15" fill="#485261"/>
      <rect x="28" y="54" width="64" height="8" rx="4" fill="#858D94"/>
    </g>

    <g transform="translate(324 314)">
      <rect width="128" height="76" rx="8" fill="#FFFFFF" stroke="#D9DDD6"/>
      <circle cx="64" cy="30" r="15" fill="#485261"/>
      <rect x="34" y="54" width="60" height="8" rx="4" fill="#858D94"/>
    </g>
    <g transform="translate(468 314)">
      <rect width="128" height="76" rx="8" fill="#FFFFFF" stroke="#D9DDD6"/>
      <circle cx="64" cy="30" r="15" fill="#0E1A2B"/>
      <rect x="36" y="54" width="56" height="8" rx="4" fill="#858D94"/>
      <circle cx="114" cy="12" r="5" fill="#2ED196"/>
    </g>
    <g transform="translate(612 314)">
      <rect width="128" height="76" rx="8" fill="#FFFFFF" stroke="#D9DDD6"/>
      <circle cx="64" cy="30" r="15" fill="#5B6573"/>
      <rect x="32" y="54" width="64" height="8" rx="4" fill="#858D94"/>
    </g>
    <g transform="translate(756 314)">
      <rect width="120" height="76" rx="8" fill="#FFFFFF" stroke="#D9DDD6"/>
      <circle cx="60" cy="30" r="15" fill="#35404F"/>
      <rect x="30" y="54" width="60" height="8" rx="4" fill="#858D94"/>
    </g>

    <g transform="translate(324 406)">
      <rect width="128" height="76" rx="8" fill="#FFFFFF" stroke="#D9DDD6"/>
      <circle cx="64" cy="30" r="15" fill="#35404F"/>
      <rect x="34" y="54" width="60" height="8" rx="4" fill="#858D94"/>
    </g>
    <g transform="translate(468 406)">
      <rect width="128" height="76" rx="8" fill="#FFFFFF" stroke="#D9DDD6"/>
      <circle cx="64" cy="30" r="15" fill="#485261"/>
      <rect x="30" y="54" width="68" height="8" rx="4" fill="#858D94"/>
    </g>
  </g>

  <!-- Glaset -->
  <rect x="300" y="158" width="600" height="345" rx="4" fill="url(#glass)"/>
