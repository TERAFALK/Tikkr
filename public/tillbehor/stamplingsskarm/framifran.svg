      <rect x="30" y="54" width="68" height="8" rx="4" fill="#858D94"/>
    </g>
    <g transform="translate(612 222)">
      <rect width="128" height="76" rx="8" fill="#FFFFFF" stroke="#D9DDD6"/>
      <circle cx="64" cy="30" r="15" fill="#35404F"/>
      <rect x="38" y="54" width="52" height="8" rx="4" fill="#858D94"/>
      <circle cx="114" cy="12" r="5" fill="#2ED196"/>
    </g>
    <g transform="translate(756 222)">
