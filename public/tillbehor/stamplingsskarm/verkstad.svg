<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Illustration: stämplingsskärmen vid en vägg i en verkstad">
  <!--
    TILLFÄLLIG ILLUSTRATION, INTE ETT FOTO.
    Byts mot ett riktigt foto från en verkstad med samma filnamn, och flaggan
    `illustration` i src/lib/shop/catalog.ts sätts då till false.
    Skärm och stativ är ritade som i framifran.svg, i mindre skala.
  -->
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ECEEE7"/>
      <stop offset="1" stop-color="#D9DDD6"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#AFB5B5"/>
      <stop offset="1" stop-color="#858D94"/>
    </linearGradient>
    <linearGradient id="window" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F5F6F2"/>
    </linearGradient>
    <linearGradient id="light" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="post" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#212D3D"/>
      <stop offset="0.5" stop-color="#35404F"/>
      <stop offset="1" stop-color="#212D3D"/>
    </linearGradient>
    <radialGradient id="shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#0E1A2B" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#0E1A2B" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Väggen, med plåtens skarvar -->
  <rect width="1200" height="640" fill="url(#wall)"/>
  <g stroke="#AFB5B5" stroke-width="2" opacity="0.6">
    <line x1="200" y1="0" x2="200" y2="640"/>
    <line x1="400" y1="0" x2="400" y2="640"/>
    <line x1="600" y1="0" x2="600" y2="640"/>
    <line x1="800" y1="0" x2="800" y2="640"/>
    <line x1="1000" y1="0" x2="1000" y2="640"/>
  </g>

  <!-- Fönsterband högt upp, och ljuset från det -->
  <rect x="60" y="60" width="1080" height="110" rx="4" fill="#5B6573"/>
  <g fill="url(#window)">
    <rect x="72" y="72" width="250" height="86"/>
    <rect x="334" y="72" width="250" height="86"/>
    <rect x="596" y="72" width="250" height="86"/>
    <rect x="858" y="72" width="270" height="86"/>
  </g>
  <polygon points="72,158 1128,158 1200,640 0,640" fill="url(#light)" opacity="0.5"/>

  <!-- Golvet -->
  <rect y="640" width="1200" height="260" fill="url(#floor)"/>
  <rect y="640" width="1200" height="6" fill="#5B6573" opacity="0.5"/>

  <!-- Arbetsbänken till vänster -->
  <g>
    <rect x="70" y="470" width="380" height="24" rx="3" fill="#35404F"/>
    <rect x="86" y="494" width="18" height="190" fill="#212D3D"/>
    <rect x="416" y="494" width="18" height="190" fill="#212D3D"/>
    <rect x="86" y="600" width="348" height="12" fill="#212D3D"/>
    <!-- Skruvstycket -->
    <rect x="120" y="436" width="90" height="34" rx="3" fill="#485261"/>
    <rect x="100" y="446" width="20" height="14" rx="2" fill="#485261"/>
    <rect x="70" y="451" width="30" height="5" rx="2" fill="#485261"/>
    <!-- Verktygstavla -->
    <rect x="90" y="250" width="340" height="170" rx="4" fill="#FFFFFF" stroke="#AFB5B5" stroke-width="2"/>
    <g fill="#5B6573">
      <rect x="120" y="280" width="10" height="90" rx="3"/>
      <rect x="160" y="275" width="14" height="70" rx="3"/>
      <rect x="205" y="285" width="8" height="100" rx="3"/>
      <circle cx="265" cy="310" r="26" fill="none" stroke="#5B6573" stroke-width="8"/>
      <rect x="320" y="282" width="70" height="12" rx="4"/>
      <rect x="320" y="312" width="56" height="12" rx="4"/>
      <rect x="320" y="342" width="80" height="12" rx="4"/>
    </g>
  </g>

  <!-- Hyllan till höger -->
  <g>
    <rect x="930" y="300" width="14" height="380" fill="#35404F"/>
    <rect x="1126" y="300" width="14" height="380" fill="#35404F"/>
    <rect x="930" y="380" width="210" height="10" fill="#35404F"/>
    <rect x="930" y="500" width="210" height="10" fill="#35404F"/>
    <rect x="930" y="620" width="210" height="10" fill="#35404F"/>
    <rect x="950" y="330" width="70" height="50" fill="#AFB5B5"/>
    <rect x="1030" y="345" width="80" height="35" fill="#858D94"/>
    <rect x="950" y="450" width="90" height="50" fill="#858D94"/>
    <rect x="1050" y="460" width="60" height="40" fill="#AFB5B5"/>
    <rect x="955" y="575" width="150" height="45" fill="#AFB5B5"/>
  </g>

  <!-- Kabelkanalen ner till skärmen -->
  <rect x="660" y="170" width="14" height="470" fill="#AFB5B5"/>

  <!-- Skärmen i sitt stativ -->
  <ellipse cx="668" cy="724" rx="150" ry="16" fill="url(#shadow)"/>
  <rect x="570" y="706" width="196" height="16" rx="4" fill="#212D3D"/>
  <rect x="652" y="520" width="32" height="190" rx="3" fill="url(#post)"/>

  <rect x="484" y="352" width="368" height="221" rx="10" fill="#0E1A2B"/>
  <rect x="495" y="363" width="346" height="199" rx="3" fill="#F5F6F2"/>
  <rect x="495" y="363" width="346" height="27" rx="3" fill="#FFFFFF"/>
  <rect x="509" y="372" width="70" height="9" rx="4.5" fill="#0E1A2B"/>
  <g>
    <rect x="509" y="401" width="74" height="44" rx="5" fill="#FFFFFF" stroke="#D9DDD6"/>
    <rect x="592" y="401" width="74" height="44" rx="5" fill="#FFFFFF" stroke="#D9DDD6"/>
    <rect x="675" y="401" width="74" height="44" rx="5" fill="#FFFFFF" stroke="#D9DDD6"/>
    <rect x="758" y="401" width="69" height="44" rx="5" fill="#FFFFFF" stroke="#D9DDD6"/>
    <rect x="509" y="454" width="74" height="44" rx="5" fill="#FFFFFF" stroke="#D9DDD6"/>
    <rect x="592" y="454" width="74" height="44" rx="5" fill="#FFFFFF" stroke="#D9DDD6"/>
    <rect x="675" y="454" width="74" height="44" rx="5" fill="#FFFFFF" stroke="#D9DDD6"/>
    <rect x="758" y="454" width="69" height="44" rx="5" fill="#FFFFFF" stroke="#D9DDD6"/>
    <rect x="509" y="507" width="74" height="44" rx="5" fill="#FFFFFF" stroke="#D9DDD6"/>
    <rect x="592" y="507" width="74" height="44" rx="5" fill="#FFFFFF" stroke="#D9DDD6"/>
    <g fill="#35404F">
      <circle cx="546" cy="418" r="9"/>
      <circle cx="629" cy="418" r="9"/>
      <circle cx="712" cy="418" r="9"/>
      <circle cx="792" cy="418" r="9"/>
      <circle cx="546" cy="471" r="9"/>
      <circle cx="629" cy="471" r="9"/>
      <circle cx="712" cy="471" r="9"/>
      <circle cx="792" cy="471" r="9"/>
      <circle cx="546" cy="524" r="9"/>
      <circle cx="629" cy="524" r="9"/>
    </g>
    <g fill="#2ED196">
      <circle cx="575" cy="408" r="3.5"/>
      <circle cx="741" cy="461" r="3.5"/>
    </g>
  </g>
</svg>
