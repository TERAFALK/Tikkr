# Tikkr — två containrar: appen och databasen.
#
# HTTPS sköts av den Nginx Proxy Manager som redan kör på servern. Därför ingen
# egen Caddy här: två program kan inte dela port 443, och NPM har redan den.
# Se README för hur Tikkr kopplas in i NPM.
#
# Starta:  docker compose up -d --build
# Stoppa:  docker compose down
# Loggar:  docker compose logs -f app

services:
  db:
    image: postgres:17-alpine
    container_name: tikkr-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tikkr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD saknas i .env}
      POSTGRES_DB: ${POSTGRES_DB:-tikkr}
    volumes:
      - tikkr_db_data:/var/lib/postgresql/data
    # Databasporten publiceras AVSIKTLIGT inte utåt. Bara appcontainern når
    # databasen, via det interna nätverket. Det undviker krock med en annan
    # Postgres på servern och gör databasen onåbar från internet.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tikkr} -d ${POSTGRES_DB:-tikkr}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Engångscontainer som sätter upp databasen och sedan avslutar. Appen väntar
  # på att den blir klar. Använder builder-steget ur Dockerfile, där Prismas
  # kommandoverktyg och alla beroenden finns — appimagen slipper dem och
  # förblir liten.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    container_name: tikkr-migrate
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-tikkr}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-tikkr}?schema=public
    command: ["sh", "./scripts/migrate.sh"]

  app:
    build:
      context: .
      dockerfile: Dockerfile
    # Fast namn så att Nginx Proxy Manager kan peka på "tikkr-app" istället för
    # en IP-adress som ändrar sig varje gång containern startas om.
    container_name: tikkr-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      # Appen startar först när databasen har rätt tabeller.
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-tikkr}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-tikkr}?schema=public
      NODE_ENV: production
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET saknas i .env}
      AUTH_TRUST_HOST: ${AUTH_TRUST_HOST:-true}
      CRON_SECRET: ${CRON_SECRET:-}
    ports:
      # Vänsterledet är porten på servern och går att ändra i .env om något
      # annat redan använder 3000.
      #
      # APP_BIND styr vem som når porten direkt:
      #   0.0.0.0   — alla, även från internet. Bra på en testserver: du kan
      #               öppna http://serverns-ip:3000 direkt från touchskärmen.
      #   127.0.0.1 — bara servern själv, all trafik måste gå via NPM och HTTPS.
      #               Detta är rätt värde i produktion.
      - "${APP_BIND:-0.0.0.0}:${APP_PORT:-3000}:3000"
    networks:
      # default = det interna nätet där appen når databasen.
      # npm_proxy = Nginx Proxy Managers nät, så att NPM kan nå appen på
      # namnet "tikkr-app". Databasen ligger AVSIKTLIGT inte här — den ska
      # inte vara nåbar från proxyns nät.
      - default
      - npm_proxy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  tikkr_db_data:

networks:
  # Nginx Proxy Managers befintliga nätverk. "external" betyder att det redan
  # finns och skapas av NPM — Tikkr ansluter bara till det och rör det inte.
  npm_proxy:
    external: true
    name: npm_proxy
